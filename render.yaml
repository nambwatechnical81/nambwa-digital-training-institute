services:
  - type: web
    name: nambwa-digital-training-institute
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: nambwa-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: MPESA_ENV
        value: production
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerBuyGoodsOnline
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_ACCOUNT_REFERENCE
        value: NAMBWA-APP
    disk:
      name: nambwa-storage
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: nambwa-postgres
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: nambwa_postgres
    user: nambwa_postgres_user
