<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAMBWA Admin</title><link rel="icon" href="logo.jpg"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><img src="logo.jpg" alt="NAMBWA logo"><span><b>NAMBWA</b><small>DIGITAL TRAINING INSTITUTE</small></span></a><button class="btn secondary" onclick="logout()">Sign out</button></div></header><main class="section"><div class="container"><div id="login" class="card form-card" style="max-width:520px;margin:auto"><div class="section-kicker">ADMINISTRATION</div><h1 style="font-family:Poppins">Administrator sign in</h1><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="btn primary full" onclick="login()">Sign in</button><div id="loginMsg" class="form-message"></div></div><div id="dash" class="hidden"><div class="section-head"><div><div class="section-kicker">ADMIN DASHBOARD</div><h2>Manage NAMBWA admissions</h2></div></div><div class="program-grid" id="apps"></div><div class="card form-card" style="margin-top:24px"><h3 class="form-title">Publish learning material</h3><div class="form-row"><label>Course<input id="mcourse"></label><label>Title<input id="mtitle"></label></div><label>Description<input id="mdesc"></label><label>URL<input id="murl" placeholder="https://..."></label><button class="btn primary" onclick="addMaterial()">Publish material</button><div id="matMsg" class="form-message"></div></div><div class="card form-card" style="margin-top:24px"><h3 class="form-title">Add student result</h3><div class="form-row"><label>Student ID<input id="sid" type="number"></label><label>Course<input id="rcourse"></label></div><div class="form-row"><label>Unit<input id="unit"></label><label>Score<input id="score" type="number"></label></div><label>Grade<input id="grade"></label><button class="btn primary" onclick="addResult()">Save result</button><div id="resMsg" class="form-message"></div></div></div></div></main><script src="admin.js"></script></body></html>
